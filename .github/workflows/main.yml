name: CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: build / php-${{ matrix.php }}-${{ matrix.ts }}-${{ matrix.name }}-${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
        name:
          - linux
        include:
          # Linux
          - { name: linux, ts: 'nts', compiler: 'gcc',   os: ubuntu-24.04 }
          # Pre-release PHP: remove once 8.6 is generally available.
          - { php: '8.6', experimental: true }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libqrencode-dev libpng-dev
      - name: phpize
        run: phpize
      - name: Configure
        run: |
          ./configure
        env:
          CC: ${{ matrix.compiler }}
      - name: Compile
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)"
      - name: Extension Info
        run: |
          php --ini
          php -d extension=./modules/qrencode.so --ri qrencode
      - name: Run Tests
        run: make test
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          TEST_PHP_ARGS: "--show-diff"
